name: npm Publish

on:
    push:
        branches: [main]
    release:
        types: [published]

permissions:
    contents: read

jobs:
    build-dev:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.1
                  package-manager-cache: false
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter tailwind-merge build
            - uses: actions/upload-artifact@v7
              with:
                  name: build-output
                  path: packages/tailwind-merge/dist
                  if-no-files-found: error

    publish-dev:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: build-dev
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Necessary for OIDC permissions for trusted publishing. Keep this isolated from dependency installation and build scripts.
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.1
                  # More info: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages#publishing-packages-to-the-npm-registry
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: build-output
                  path: packages/tailwind-merge/dist
                  digest-mismatch: error
            - name: Set dev package version
              working-directory: packages/tailwind-merge
              run: |
                  node --input-type=module <<'EOF'
                  import fs from 'node:fs'

                  const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
                  packageJson.version = `${packageJson.version}-dev.${process.env.GITHUB_SHA}`
                  fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 4)}\n`)
                  EOF
            - run: npm publish --access public --tag dev --ignore-scripts
              working-directory: packages/tailwind-merge

    build-prod:
        if: github.event_name == 'release' && github.event.action == 'published'
        runs-on: ubuntu-latest
        outputs:
            package-name: ${{ steps.resolve_package.outputs.name }}
            package-dir: ${{ steps.resolve_package.outputs.dir }}
        steps:
            - name: Resolve the released package from the release tag
              id: resolve_package
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  # Release tags are namespaced per package (<package-name>@<version>); plain v-prefixed tags predate the monorepo and belong to tailwind-merge.
                  case "$RELEASE_TAG" in
                      tailwind-merge@*|v*)
                          name=tailwind-merge
                          dir=packages/tailwind-merge
                          ;;
                      @tailwind-merge/vite@*)
                          name=@tailwind-merge/vite
                          dir=packages/vite
                          ;;
                      *)
                          echo "::error::Cannot resolve a workspace package from release tag ${RELEASE_TAG}"
                          exit 1
                          ;;
                  esac
                  echo "name=${name}" >> "$GITHUB_OUTPUT"
                  echo "dir=${dir}" >> "$GITHUB_OUTPUT"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.1
                  package-manager-cache: false
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm test
            - run: pnpm --filter "$PACKAGE_NAME" build
              env:
                  PACKAGE_NAME: ${{ steps.resolve_package.outputs.name }}
            # --if-present because only tailwind-merge ships packaged-exports smoke tests so far; a package gaining a build step should add its own release gate here.
            - run: pnpm --filter "$PACKAGE_NAME" run --if-present test:exports
              env:
                  PACKAGE_NAME: ${{ steps.resolve_package.outputs.name }}
            - uses: actions/upload-artifact@v7
              with:
                  name: build-output
                  path: ${{ steps.resolve_package.outputs.dir }}/dist
                  if-no-files-found: error

    publish-prod:
        if: github.event_name == 'release' && github.event.action == 'published'
        needs: build-prod
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Necessary for OIDC permissions for trusted publishing. Keep this isolated from dependency installation and build scripts.
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.1
                  # More info: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages#publishing-packages-to-the-npm-registry
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: build-output
                  path: ${{ needs.build-prod.outputs.package-dir }}/dist
                  digest-mismatch: error
            # --access public covers the first publish of scoped packages (@tailwind-merge/*); it is the default for the unscoped tailwind-merge anyway.
            - run: npm publish --access public --ignore-scripts
              working-directory: ${{ needs.build-prod.outputs.package-dir }}
