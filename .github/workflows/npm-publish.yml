name: npm Publish

on:
    push:
        branches: [main]
    release:
        types: [published]

permissions:
    contents: read

jobs:
    build-dev:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.1
                  package-manager-cache: false
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            # Both dev packages build here; pnpm's topological order builds the library before the vite package, whose test:exports verifies its packed tarball against the library's built shape. The configurator is inlined into the vite bundle and has no dev release of its own.
            - run: pnpm --filter tailwind-merge --filter @tailwind-merge/vite build
            - run: pnpm --filter tailwind-merge --filter @tailwind-merge/vite test:exports
            - uses: actions/upload-artifact@v7
              with:
                  name: build-output-tailwind-merge
                  path: packages/tailwind-merge/dist
                  if-no-files-found: error
            - uses: actions/upload-artifact@v7
              with:
                  name: build-output-vite
                  path: packages/vite/dist
                  if-no-files-found: error

    publish-dev:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: build-dev
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Necessary for OIDC permissions for trusted publishing. Keep this isolated from dependency installation and build scripts.
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.1
                  # No registry-url on purpose: it would write an .npmrc auth line referencing the unset NODE_AUTH_TOKEN, which pnpm's config loader rejects. pnpm publishes to its default registry through npm trusted publishing (OIDC), needing no token plumbing.
                  package-manager-cache: false
            - run: corepack enable
            # The vite package's devDependencies keep a `workspace:` specifier (the inlined configurator), which pnpm rewrites at publish time by reading the linked manifest from node_modules — the same scripts-disabled, package-filtered install the release job uses, so no dependency code runs in the job holding the OIDC token. tailwind-merge needs no install: its specifiers are all `catalog:` and resolve from pnpm-workspace.yaml.
            - run: pnpm install --frozen-lockfile --ignore-scripts --filter @tailwind-merge/vite
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: build-output-tailwind-merge
                  path: packages/tailwind-merge/dist
                  digest-mismatch: error
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: build-output-vite
                  path: packages/vite/dist
                  digest-mismatch: error
            # Stamps `<version>-dev.<sha>` on both manifests and pins the vite package's tailwind-merge dependency to the library's same-commit dev version (see the script header for why the pin is exact). Both stamps run before either publish so the manifests agree before anything leaves the runner.
            - name: Stamp dev versions
              run: |
                  (cd packages/tailwind-merge && node ../../scripts/stamp-dev-version.mjs)
                  (cd packages/vite && node ../../scripts/stamp-dev-version.mjs)
            # pnpm instead of npm so publishing matches the release flow: publishConfig field overrides are applied at pack time and trusted publishing runs through pnpm's native OIDC flow. --provenance must be explicit (pnpm does not read publishConfig.provenance); --no-git-checks because the version stamp above dirties the tree and the checkout is a detached HEAD. The library publishes first because the vite dev build depends on exactly this version.
            - run: pnpm publish --access public --tag dev --provenance --ignore-scripts --no-git-checks
              working-directory: packages/tailwind-merge
            - run: pnpm publish --access public --tag dev --provenance --ignore-scripts --no-git-checks
              working-directory: packages/vite

    build-prod:
        if: github.event_name == 'release' && github.event.action == 'published'
        runs-on: ubuntu-latest
        outputs:
            package-name: ${{ steps.resolve_package.outputs.name }}
            package-dir: ${{ steps.resolve_package.outputs.dir }}
        steps:
            - name: Resolve the released package from the release tag
              id: resolve_package
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  # Release tags are namespaced per package (<package-name>@<version>); plain v-prefixed tags predate the monorepo and belong to tailwind-merge.
                  case "$RELEASE_TAG" in
                      tailwind-merge@*|v*)
                          name=tailwind-merge
                          dir=packages/tailwind-merge
                          ;;
                      @tailwind-merge/vite@*)
                          name=@tailwind-merge/vite
                          dir=packages/vite
                          ;;
                      *)
                          echo "::error::Cannot resolve a workspace package from release tag ${RELEASE_TAG}"
                          exit 1
                          ;;
                  esac
                  echo "name=${name}" >> "$GITHUB_OUTPUT"
                  echo "dir=${dir}" >> "$GITHUB_OUTPUT"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.1
                  package-manager-cache: false
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm test
            # The library builds in every release flow: the vite package's test:exports verifies its packed tarball against tailwind-merge's published shape (dist and types). For a tailwind-merge release the two filters name the same package and it builds once; for a vite release pnpm's topological order builds the library first.
            - run: pnpm --filter tailwind-merge --filter "$PACKAGE_NAME" build
              env:
                  PACKAGE_NAME: ${{ steps.resolve_package.outputs.name }}
            # Both packages ship a test:exports release gate: the library's built-bundle smoke tests, the vite package's packed-tarball verification.
            - run: pnpm --filter "$PACKAGE_NAME" test:exports
              env:
                  PACKAGE_NAME: ${{ steps.resolve_package.outputs.name }}
            - uses: actions/upload-artifact@v7
              with:
                  name: build-output
                  path: ${{ steps.resolve_package.outputs.dir }}/dist
                  if-no-files-found: error

    publish-prod:
        if: github.event_name == 'release' && github.event.action == 'published'
        needs: build-prod
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Necessary for OIDC permissions for trusted publishing. Keep this isolated from dependency installation and build scripts.
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.1
                  # No registry-url on purpose: it would write an .npmrc auth line referencing the unset NODE_AUTH_TOKEN, which pnpm's config loader rejects. pnpm publishes to its default registry through npm trusted publishing (OIDC), needing no token plumbing.
                  package-manager-cache: false
            - run: corepack enable
            # pnpm resolves `workspace:` specifiers at publish time by reading the linked package's manifest from node_modules (the vite package depends on tailwind-merge that way), so the released package's dependencies are installed here — for that package only, with lifecycle scripts disabled, so no dependency code runs in the job holding the OIDC token. `catalog:` specifiers need no install; they resolve from pnpm-workspace.yaml.
            - run: pnpm install --frozen-lockfile --ignore-scripts --filter "$PACKAGE_NAME"
              env:
                  PACKAGE_NAME: ${{ needs.build-prod.outputs.package-name }}
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: build-output
                  path: ${{ needs.build-prod.outputs.package-dir }}/dist
                  digest-mismatch: error
            # pnpm instead of npm: pnpm applies publishConfig field overrides at pack time (the vite package swaps its dist exports in that way) and implements npm trusted publishing natively (GitHub OIDC id-token, exchanged per package at the registry, publishing through npm's own libnpmpublish vendored inside pnpm). --provenance must be explicit because pnpm does not read publishConfig.provenance; --no-git-checks because the checkout is a detached HEAD. --access public covers the first publish of scoped packages (@tailwind-merge/*); it is the default for the unscoped tailwind-merge anyway.
            - run: pnpm publish --access public --provenance --ignore-scripts --no-git-checks
              working-directory: ${{ needs.build-prod.outputs.package-dir }}
