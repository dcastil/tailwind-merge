name: Benchmark

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    benchmark:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.18.1
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            - name: Run benchmark
              # Pinned from CodSpeedHQ/action@v5.6.0.
              uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062
              with:
                  # This public repository uses CodSpeed tokenless uploads so PR benchmark code does not receive a long-lived upload token or OIDC permission.
                  mode: simulation
                  run: pnpm --filter tailwind-merge bench
