# Drafts releases for the @tailwind-merge/vite package. Releases are per package with namespaced tags; tag-prefix scopes previous-release lookup and version resolution to this package's tags, and include-paths keeps pull requests that don't touch the package out of the draft. No autolabeler section here — PR labels are repo-wide and applied once via the tailwind-merge config.
name-template: '@tailwind-merge/vite@$RESOLVED_VERSION'
tag-template: '@tailwind-merge/vite@$RESOLVED_VERSION'
tag-prefix: '@tailwind-merge/vite@'
include-paths:
    - packages/vite
template: |
    $CHANGES

    **Full Changelog**: https://github.com/dcastil/tailwind-merge/compare/$PREVIOUS_TAG...@tailwind-merge/vite@$RESOLVED_VERSION
category-template: '### $TITLE'
change-template: '- $TITLE by @$AUTHOR in https://github.com/dcastil/tailwind-merge/pull/$NUMBER'
change-title-escapes: '\<*_&'
no-changes-template: 'No changes'
categories:
    - title: '⚠️ Needs Changelog Edit'
      label: 'needs changelog edit'
    - title: 'Breaking Changes'
      label: 'breaking'
    - title: 'New Features'
      label: 'feature'
    - title: 'Bug Fixes'
      label: 'bug'
    - title: 'Documentation'
      label: 'documentation'
    - title: 'Other'
      label: 'other'
exclude-labels:
    - 'skip changelog'
version-resolver:
    major:
        labels:
            - 'breaking'
    minor:
        labels:
            - 'feature'
    patch:
        labels:
            - 'bug'
            - 'documentation'
            - 'other'
    default: 'patch'
